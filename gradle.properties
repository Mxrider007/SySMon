# Tuned for a 4 GB build host that also runs a desktop session; raise on a bigger machine.
# Single worker + in-process Kotlin compilation = one JVM total, to avoid OOM-killing the host.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
